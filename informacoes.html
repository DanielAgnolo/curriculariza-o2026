<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruQuiz</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="index.html">
</head>

<body class="pagina-info">

    <div class="container">

        <div class="card">

            <h2 class="titulo-info">
                Antes de começar a jogar,<br>
                preencha seus dados
            </h2>

            <form>

                <label>Nome:</label>
                <input id="nome" type="text" placeholder="Responda aqui seu nome...">

                <label>Escola</label>
                <input id="escola" type="text" placeholder="Coloque aqui o nome da sua Escola...">

                <label>Idade</label>
                <input id="idade" type="number" placeholder="Coloque sua idade...">

                <button type="button" class="btn-iniciar">
                    Ir para o Jogo
                </button>

            </form>

        </div>

    </div>
    <script src="script.js"></script>
</body>
